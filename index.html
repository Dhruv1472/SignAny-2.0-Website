        <!-- ── COMPLIANCE & GLOBAL FRAMEWORKS ──────────────────────────── -->
        <section id="compliance">
          <h2>Trust &amp; Compliance — Legally binding across 15+ global compliance frameworks</h2>
          <p>
            SignAny 2.0 supports electronic signing requirements across 15+ compliance frameworks, helping businesses maintain
            secure, traceable, and legally recognized signing workflows with tamper-evident SHA-256 audit trails.
          </p>
          <ul>
            <li><strong>ESIGN Act:</strong> US Electronic Signatures in Global and National Commerce Act</li>
            <li><strong>UETA:</strong> Uniform Electronic Transactions Act (US States)</li>
            <li><strong>eIDAS (AES):</strong> EU Electronic Identification and Trust Services (Advanced Electronic Signatures)</li>
            <li><strong>GDPR:</strong> General Data Protection Regulation (Europe, UK)</li>
            <li><strong>GLBA:</strong> Gramm-Leach-Bliley Act (US, Europe, UK)</li>
            <li><strong>UAE Pass Authentication &amp; Federal Decree Law No. 46 of 2021:</strong> Electronic Transactions &amp; Trust Services Law (UAE)</li>
            <li><strong>UAE PDPL:</strong> Personal Data Protection Law (UAE)</li>
            <li><strong>UK ECA 2000:</strong> UK Electronic Communications Act</li>
            <li><strong>Singapore ETA &amp; PDPA:</strong> Electronic Transactions Act &amp; Personal Data Protection Act (Singapore)</li>
            <li><strong>AU ETA 1999:</strong> Electronic Transactions Act (Australia)</li>
            <li><strong>HIPAA:</strong> Health Insurance Portability and Accountability Act (USA)</li>
            <li><strong>21 CFR Part 11:</strong> FDA Electronic Records &amp; Signatures (USA)</li>
            <li><strong>PIPEDA, Canada Evidence Act &amp; UECA:</strong> Electronic Commerce &amp; Evidence Acts (Canada)</li>
            <li><strong>CCPA:</strong> California Consumer Privacy Act (USA)</li>
            <li><strong>KSA PDPL:</strong> Personal Data Protection Law (Saudi Arabia)</li>
            <li><strong>Swiss revFADP:</strong> Federal Act on Data Protection (Switzerland)</li>
          </ul>
          <h3>Security &amp; Audit Guarantee</h3>
          <ul>
            <li><strong>Tamper-Evident Audit Trail:</strong> Cryptographic SHA-256 logs recording IP addresses, location data, and timestamps.</li>
            <li><strong>256-Bit Encryption:</strong> AES-256 encryption at rest and TLS 1.3 in transit.</li>
            <li><strong>Court-Admissible Validity:</strong> Enforceable Certificates of Completion generated with every executed agreement.</li>
          </ul>
        </section>

          <dl>
            <dt>What is SignAny 2.0?</dt>
            <dd>SignAny 2.0 is a next-generation electronic signature platform for sending, signing and managing legally binding documents. It combines document preparation, smart fields, multi-signer routing, real-time tracking and global compliance in a single secure workspace.</dd>

            <dt>How many documents can I send on the Free plan?</dt>
            <dd>The Free plan includes 5 documents per month and lets you invite additional users into your workspace, so a small team can try the full signing workflow at no cost.</dd>

            <dt>What is included in the Pro plan?</dt>
            <dd>Pro costs $35 USD per month and includes 100 documents per month, up to 4 additional users in the workspace, email integrations (Gmail, Outlook, Zoho Mail), scheduling, reminders, custom email templates and dashboard analytics.</dd>

            <dt>Are signatures created with SignAny 2.0 legally binding?</dt>
            <dd>Yes. Documents signed with SignAny 2.0 meet the requirements of the ESIGN Act and UETA in the United States, eIDAS up to AES Level 2 in the European Union, the UK Electronic Communications Act 2000, Singapore's Electronic Transactions Act, Australia's ETA 1999, Canada's UECA and UAE Federal Decree Law No. 46 of 2021, among others.</dd>

            <dt>Does SignAny 2.0 offer a REST API?</dt>
            <dd>Yes. Our REST API lets you embed SignAny 2.0 signing directly into any CRM, ERP, customer portal or in-house application, with secure token access and status callbacks so your records stay in sync.</dd>

            <dt>How is my data protected?</dt>
            <dd>Documents are encrypted in transit and at rest, stored in secure data centres with strict access controls, and every action is written to a tamper-evident audit trail attached to the completed document.</dd>

            <dt>Can I cancel or change my plan at any time?</dt>
            <dd>Yes. You can upgrade, downgrade or cancel from your account settings at any time and keep access until the end of the current billing period.</dd>

            <dt>How do I send documents for signature in Salesforce?</dt>
            <dd>SignAny 2.0 integrates with Salesforce so users can send documents for electronic signature from their Salesforce workflow and track signing activity.</dd>

            <dt>What is Salesforce eSignature?</dt>
            <dd>Salesforce eSignature lets businesses send documents for electronic signing while keeping the signing process connected to their Salesforce workflow.</dd>

            <dt>How does eSignature work in Salesforce?</dt>
            <dd>Connect an eSignature solution with Salesforce, send documents to recipients, collect signatures, and monitor signing status from the connected workflow.</dd>

            <dt>What is an electronic signature date?</dt>
            <dd>The electronic signature date records when a signer completed the signing action and can form part of the document's audit record.</dd>

            <dt>What should I do if my eSignature is not working in Salesforce?</dt>
            <dd>Check the Salesforce connection, user permissions, document status, recipient details, and signing link. If the issue continues, contact your eSignature provider's support team.</dd>

            <dt>Can I use eSignature in Salesforce?</dt>
            <dd>Yes. SignAny 2.0 connects with Salesforce to support electronic signing workflows, including sending documents, collecting signatures, and tracking signing activity.</dd>

            <dt>How can I add an email signature in Salesforce?</dt>
            <dd>Salesforce email signatures are separate from electronic document signatures. Email signature settings can be configured within Salesforce for emails sent by users.</dd>

            <dt>How do I change my email signature in Salesforce?</dt>
            <dd>You can update your personal email signature through your Salesforce user settings. This changes the signature added to your Salesforce emails, not an electronic document signature.</dd>
