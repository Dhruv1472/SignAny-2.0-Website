            Prepare documents with smart fields, route up to five signers, automate reminders, and

        <!-- ── Key Features ───────────────────────────────────────────────── -->
        <section id="features">
          <h2>Core capabilities — Everything you need to run digital signatures</h2>
          <p>From upload to signed and archived — SignAny 2.0 removes the manual steps between you and a completed agreement.</p>
          <ul>
            <li><strong>Multi-document upload &amp; reorder:</strong> Upload several PDFs or Word files in a single envelope, rename them, and drag them into the exact order your signers should read.</li>
            <li><strong>Up to 5 signers per document:</strong> Add signer names and email addresses, then place signature boxes and fields for each recipient with per-signer colour coding.</li>
            <li><strong>Sequential or simultaneous signing:</strong> Send in a strict order or release the document to everyone at once — switch the flow per document or set a workspace default.</li>
            <li><strong>Smart field configuration:</strong> Signature, text, date, checkbox, dropdown and read-only fields with max length, default values, required rules and font formatting.</li>
            <li><strong>Scheduling, expiry &amp; reminders:</strong> Schedule a send for later, set one-time or recurring expiry up to 90 days, and let automated reminders keep signers moving.</li>
            <li><strong>Mobile-first signing:</strong> Signers open a secure link and complete the document on any phone, tablet or desktop browser — no account, no app download.</li>
          </ul>
        </section>

        <!-- ── Workspace & Admin ──────────────────────────────────────────── -->
        <section id="workspace">
          <h2>Workspace &amp; admin — Visibility and control for the whole team</h2>
          <p>Dashboards, audit trails, access control and configurable defaults keep every document accountable from the moment it is created.</p>
          <ul>
            <li><strong>Live dashboard &amp; metrics:</strong> Document status overview, average completion days, monthly sending trend, department-wise distribution and plan usage in one view.</li>
            <li><strong>All Documents workspace:</strong> Search by Doc ID, name, sender or email, filter by status and date, and export every record straight to CSV.</li>
            <li><strong>Full audit trail:</strong> Signer-level status, timestamps and a complete document activity log, with an audit report attached on completion.</li>
            <li><strong>Expiring soon alerts:</strong> See everything expiring today or in the next 7 days so follow-ups happen before a deal stalls.</li>
            <li><strong>Access &amp; ownership control:</strong> Share documents with people or teams as Editor or Viewer, transfer ownership, and revoke access at any time.</li>
            <li><strong>Branded email templates:</strong> Customise signing, status update, reminder, completed and void emails, plus your own terms and consent text for signers.</li>
          </ul>
        </section>

        <!-- ── Permission Sets ────────────────────────────────────────────── -->
        <section id="permissions">
          <h2>Permission sets — Two clear roles: Admin and Member</h2>
          <p>SignAny 2.0 keeps access simple. Admins own configuration and governance; Members get everything they need to move documents forward.</p>
          <article>
            <h3>Admin — Full workspace control and governance</h3>
            <ul>
              <li>Manage workspace members, invite new users and revoke seats</li>
              <li>Configure email integrations (Gmail, Outlook, Zoho Mail)</li>
              <li>Customise global email templates, consent copy and branding</li>
              <li>View organisation-wide analytics and billing</li>
            </ul>
          </article>
          <article>
            <h3>Member — Everything needed to send and manage day-to-day</h3>
            <ul>
              <li>Upload, prepare, route and send document envelopes</li>
              <li>Track document status in the personal and team workspace</li>
              <li>Download completed documents, certificates and audit logs</li>
              <li>Manage contacts and recipient address books</li>
            </ul>
          </article>
        </section>

        <!-- ── API & Integrations ─────────────────────────────────────────── -->
        <section id="api">
          <h2>API &amp; integrations — Bring signing into any CRM or portal</h2>
          <p>SignAny 2.0 ships with a REST API and ready-made connectors, so your team signs where they already work instead of switching tools.</p>
          <ul>
            <li><strong>REST API for any system:</strong> Create envelopes, add signers, place fields, send and download completed documents programmatically from your own product.</li>
            <li><strong>CRM &amp; portal ready:</strong> Use SignAny 2.0 inside Salesforce, your customer portal, HR system or any in-house app — no rip-and-replace required.</li>
            <li><strong>Status callbacks:</strong> Receive document and signer status updates so your records stay in sync without polling.</li>
            <li><strong>Secure token access:</strong> Scoped API credentials issued and revoked by workspace admins, with every call written to the audit trail.</li>
          </ul>
        </section>

        <!-- ── Compliance Section ────────────────────────────────────────── -->
        <section id="compliance">
          <h2>Trust &amp; Compliance — Legally binding across 15+ global compliance frameworks</h2>
          <p>SignAny 2.0 is engineered against the electronic transaction laws that govern your market — every signature holds full court-admissible validity with tamper-evident SHA-256 audit trails.</p>
          <ul>
            <li><strong>ESIGN Act:</strong> US Electronic Signatures in Global and National Commerce Act</li>
            <li><strong>UETA:</strong> Uniform Electronic Transactions Act (US States)</li>
            <li><strong>eIDAS (AES):</strong> EU Electronic Identification and Trust Services (Advanced Electronic Signatures)</li>
            <li><strong>GDPR:</strong> General Data Protection Regulation (EU)</li>
            <li><strong>GLBA:</strong> Gramm-Leach-Bliley Act</li>
            <li><strong>UK ECA 2000:</strong> UK Electronic Communications Act</li>
            <li><strong>Singapore ETA:</strong> Electronic Transactions Act (Singapore)</li>
            <li><strong>AU ETA 1999:</strong> Electronic Transactions Act (Australia)</li>
            <li><strong>UAE Decree Law No. 46 of 2021:</strong> Electronic Transactions &amp; Trust Services Law (UAE)</li>
            <li><strong>21 CFR Part 11:</strong> FDA Electronic Records &amp; Signatures</li>
            <li><strong>HIPAA:</strong> Health Insurance Portability and Accountability Act</li>
            <li><strong>PIPEDA:</strong> Personal Information Protection and Electronic Documents Act (Canada)</li>
          </ul>
        </section>

        <section id="faqs">
          <h2>Frequently Asked Questions — SignAny 2.0</h2>
          <dl>
            <dt>What is SignAny 2.0?</dt>
            <dd>SignAny 2.0 is a next-generation electronic signature platform for sending, signing and managing legally binding documents. It combines document preparation, smart fields, multi-signer routing, real-time tracking and global compliance in a single secure workspace.</dd>

            <dt>How many documents can I send on the Free plan?</dt>
            <dd>The Free plan includes 5 documents per month and lets you invite additional users into your workspace, so a small team can try the full signing workflow at no cost.</dd>

            <dt>What is included in the Pro plan?</dt>
            <dd>Pro costs $35 USD per month and includes 100 documents per month, up to 4 additional users in the workspace, email integrations (Gmail, Outlook, Zoho Mail), scheduling, reminders, custom email templates and dashboard analytics.</dd>

            <dt>Are signatures created with SignAny 2.0 legally binding?</dt>
            <dd>Yes. Documents signed with SignAny 2.0 meet the requirements of the ESIGN Act and UETA (US), eIDAS up to AES Level 2 (EU), UK ECA 2000, Singapore ETA, AU ETA 1999, Canada UECA, and UAE Federal Decree Law No. 46 of 2021.</dd>

            <dt>Does SignAny 2.0 offer an API?</dt>
            <dd>Yes. Our REST API lets you embed SignAny 2.0 signing directly into any CRM, ERP, customer portal or in-house application, with secure token access and status callbacks.</dd>

            <dt>How is my data protected?</dt>
            <dd>Documents are encrypted in transit and at rest, stored in secure data centres with strict access controls, and every action is written to a tamper-evident audit trail attached to the completed document.</dd>
          </dl>
          <p><a href="/faqs">View All FAQs &rarr;</a></p>
        </section>
