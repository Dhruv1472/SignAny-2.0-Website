            "@type": "Question",
            "name": "What is SignAny 2.0?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "SignAny 2.0 is a next-generation digital signature platform designed for speed, security, and seamless integration. It allows individuals and teams to sign, send, and manage legally binding documents with ease."
            }
          },
          {
            "@type": "Question",
            "name": "Is SignAny 2.0 free to use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, we offer a Starter plan for individuals. For teams requiring advanced features like custom branding, we offer Business and Enterprise plans."
            }
          },
          {
            "@type": "Question",
            "name": "How many documents can I sign?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The number of documents depends on your plan. Starter includes 5/mo, while Business and Enterprise offer unlimited document processing."
            }
          },
          {
            "@type": "Question",
            "name": "How secure is SignAny 2.0?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We use 256-bit AES encryption for all data at rest and TLS for data in transit. SignAny 2.0 is fully compliant with ESIGN Act, UETA, GLBA, and eIDAS (AES) Level 2."
            }
          },
          {
            "@type": "Question",
            "name": "Are signatures legally binding?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Digital signatures created with SignAny 2.0 meet the legal requirements of the ESIGN Act and UETA in the United States, eIDAS (AES) Level 2 in the European Union, Singapore's Electronic Transactions Act, AU Electronic Transactions Act 1999, and the UK's Electronic Communications Act 2000."
            }
          },
          {
            "@type": "Question",
            "name": "Where is my data stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "All data is stored in highly secure, geographically redundant data centers with 24/7 monitoring and strict access controls."
            }
          },
          {
            "@type": "Question",
            "name": "Can I cancel my subscription anytime?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely. You can cancel your subscription at any time from your account settings. You will continue to have access until the end of your current billing period."
            }
          },
          {
            "@type": "Question",
            "name": "Do you offer discounts for non-profits?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes! We support the mission of non-profit organizations. Please contact our sales team for special pricing information."
            }
          },
          {
            "@type": "Question",
            "name": "Does SignAny 2.0 have an API?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, our REST API allows you to integrate SignAny's signature workflows directly into your own applications or websites."
            }
          },

            "@type": "Question",

            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We support all modern browsers, including Chrome, Firefox, Safari, and Edge. Our signing interface is also optimized for mobile browsers."
            }
